<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Image Generator</title>
    <style>
        /* style for whole page*/
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Main container box */
        .container{
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 10px #ccc;
        }
        /* Text input area */
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        #loading {
            display: none;
            margin-top: 10px;
            color: orange;
        }
        #error {
            color: red;
            margin-top: 10px;
        }
        /* Generated image */
        img {
            margin-top: 15px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Text to Image</h2>

        <!-- FORM WRAPS INPUTS FOR CSRF -->
        <form id="imageForm">
            {% csrf_token %}
            <textarea id="prompt" placeholder="Enter Image description..."></textarea>
            <button type="submit">Generate Image</button>
        </form>

        <div id="loading">Generating image...</div>
        <div id="error"></div>
        <img id="resultImage" />
    </div>

    <script>
        // Listen to form submit event
        document.getElementById("imageForm").addEventListener("submit", function(e){
            e.preventDefault(); // Prevent page reload

            const promptText = document.getElementById('prompt').value;
            const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            document.getElementById("loading").style.display = "block";
            document.getElementById("error").innerText = "";
            document.getElementById("resultImage").src = "";

            // Send POST request to backend
            fetch("/generate/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrftoken
                },
                body: JSON.stringify({ prompt: promptText })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("loading").style.display = "none";

                if (data.image_url) {
                    document.getElementById("resultImage").src = data.image_url;
                } else {
                    document.getElementById("error").innerText = data.error || "Failed to generate image.";
                }
            })
            .catch(error => {
                document.getElementById("loading").style.display = "none";
                document.getElementById("error").innerText = "Failed to generate image. Try again.";
            });
        });
    </script>
</body>
</html>
